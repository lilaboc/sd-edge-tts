
AddModule "edge-tts-generic" "sd_generic" "edge-tts-generic.conf"

# Use espeak-ng as default for broad compatibility (Firefox, web, etc.)
DefaultModule "espeak-ng"

# Prefer edge-tts for Chinese
LanguageDefaultModule "zh"    "edge-tts-generic"
LanguageDefaultModule "zh-CN" "edge-tts-generic"
LanguageDefaultModule "zh-HK" "edge-tts-generic"
LanguageDefaultModule "zh-TW" "edge-tts-generic"

# Prefer edge-tts for Japanese and Korean
LanguageDefaultModule "ja"    "edge-tts-generic"
LanguageDefaultModule "ja-JP" "edge-tts-generic"
LanguageDefaultModule "ko"    "edge-tts-generic"
LanguageDefaultModule "ko-KR" "edge-tts-generic"

AudioOutputMethod "pipewire"
