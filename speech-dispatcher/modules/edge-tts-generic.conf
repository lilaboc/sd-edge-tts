
# Must be UTF-8 for Chinese/Japanese/Korean text (default is iso-8859-1 which corrupts non-Latin text)
GenericDefaultCharset "UTF-8"

GenericExecuteSynth "export XDATA='$DATA'; echo \"$XDATA\" | sed -z 's/\\n/ /g' | edge-tts --file - --voice $VOICE --write-media - 2>/dev/null | mpv --no-terminal --keep-open=no - 2>/dev/null"

